name: Rebuild gallery images

on:
  push:
    branches:
      - fix/image-quality
    paths:
      - .gallery-rebuild-trigger
      - .github/workflows/rebuild-gallery.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout branch with history
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Restore original high-resolution menu photos
        run: |
          mkdir -p /tmp/bezdna-originals
          git show ddc9f8eb6e0e172ce8c951dedcd6054f41b4ae29:public/food/ribs.jpg > /tmp/bezdna-originals/ribs.jpg
          git show ddc9f8eb6e0e172ce8c951dedcd6054f41b4ae29:public/food/burger-dvabro.jpg > /tmp/bezdna-originals/burger-dvabro.jpg
          git show ddc9f8eb6e0e172ce8c951dedcd6054f41b4ae29:public/food/pizza-dyavolitsa.jpg > /tmp/bezdna-originals/pizza-dyavolitsa.jpg

      - name: Install image encoder
        run: npm install --no-save sharp@0.34.4

      - name: Encode high-quality WebP and AVIF
        run: |
          node <<'NODE'
          const sharp = require("sharp");
          const path = require("path");

          const files = [
            ["ribs.jpg", "ribs-hq"],
            ["burger-dvabro.jpg", "burger-dvabro-hq"],
            ["pizza-dyavolitsa.jpg", "pizza-dyavolitsa-hq"],
          ];

          async function main() {
            for (const [input, output] of files) {
              const src = path.join("/tmp/bezdna-originals", input);
              const base = path.join("public/food", output);
              const image = sharp(src).resize({
                width: 1600,
                withoutEnlargement: true,
                fit: "inside",
              });

              await image.clone().webp({
                quality: 88,
                effort: 6,
                smartSubsample: true,
              }).toFile(base + ".webp");

              await image.clone().avif({
                quality: 62,
                effort: 6,
                chromaSubsampling: "4:4:4",
              }).toFile(base + ".avif");
            }
          }

          main().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE

      - name: Show resulting sizes
        run: ls -lh public/food/*-hq.*

      - name: Commit optimized photos to branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/food/*-hq.webp public/food/*-hq.avif
          git diff --cached --quiet && exit 0
          git commit -m "Generate high-quality optimized gallery photos [skip ci]"
          git push
