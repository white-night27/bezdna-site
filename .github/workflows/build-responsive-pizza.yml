name: Build responsive pizza assets

on:
  push:
    branches:
      - perf/responsive-pizza
    paths:
      - .github/workflows/build-responsive-pizza.yml

permissions:
  contents: write

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Install Sharp
        run: npm install --no-save sharp@0.34.4

      - name: Generate 640px and 960px pizza variants
        run: |
          node <<'NODE'
          const sharp = require("sharp");
          const src = "public/food/pizza-dyavolitsa-v2.webp";
          const variants = [640, 960];

          async function run() {
            for (const width of variants) {
              const base = `public/food/pizza-dyavolitsa-${width}`;
              const image = sharp(src).resize({
                width,
                withoutEnlargement: true,
                fit: "inside",
              });

              await image.clone().avif({
                quality: 56,
                effort: 6,
                chromaSubsampling: "4:4:4",
              }).toFile(base + ".avif");

              await image.clone().webp({
                quality: 82,
                effort: 6,
                smartSubsample: true,
              }).toFile(base + ".webp");
            }
          }

          run().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
          ls -lh public/food/pizza-dyavolitsa-{640,960}.{avif,webp}

      - name: Commit optimized variants
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/food/pizza-dyavolitsa-640.avif public/food/pizza-dyavolitsa-640.webp
          git add public/food/pizza-dyavolitsa-960.avif public/food/pizza-dyavolitsa-960.webp
          git diff --cached --quiet && exit 0
          git commit -m "Generate responsive pizza images [skip ci]"
          git pull --rebase origin perf/responsive-pizza
          git push origin HEAD:perf/responsive-pizza
