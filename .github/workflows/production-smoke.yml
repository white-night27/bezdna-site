name: Production desktop/mobile smoke

on:
  push:
    branches:
      - fix/pc-mobile-production
  workflow_dispatch:

permissions:
  contents: read

jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Playwright outside app
        run: |
          mkdir -p /tmp/bezdna-prod-tools
          cd /tmp/bezdna-prod-tools
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0
          ./node_modules/.bin/playwright install --with-deps chromium
      - name: Check live desktop and mobile
        env:
          PLAYWRIGHT_MODULE: /tmp/bezdna-prod-tools/node_modules/playwright
        run: node tests/production-smoke.cjs
      - name: Upload production diagnostics
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: production-pc-mobile
          path: artifacts/production/
          if-no-files-found: ignore
          retention-days: 7
