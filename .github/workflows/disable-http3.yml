name: Disable Cloudflare HTTP3 for reliability

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/disable-http3.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  disable-http3:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Disable HTTP/3 on bezdna-bar.ru
        env:
          CF_TOKEN_PRIMARY: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CF_TOKEN_ALT: ${{ secrets.CF_API_TOKEN }}
          CF_ZONE_ID: ${{ secrets.CLOUDFLARE_ZONE_ID }}
        run: |
          set -euo pipefail

          TOKEN="$CF_TOKEN_PRIMARY"
          if [ -z "$TOKEN" ]; then TOKEN="$CF_TOKEN_ALT"; fi
          if [ -z "$TOKEN" ]; then
            echo "::error::No Cloudflare API token secret is available in this repository."
            exit 2
          fi

          ZONE_ID="$CF_ZONE_ID"
          if [ -z "$ZONE_ID" ]; then
            ZONE_ID="$(curl -fsS \
              -H "Authorization: Bearer $TOKEN" \
              -H "Content-Type: application/json" \
              "https://api.cloudflare.com/client/v4/zones?name=bezdna-bar.ru&status=active" \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d["result"][0]["id"] if d.get("success") and d.get("result") else "")')"
          fi

          if [ -z "$ZONE_ID" ]; then
            echo "::error::Could not resolve Cloudflare zone id for bezdna-bar.ru."
            exit 3
          fi

          echo "Current HTTP/3 setting:"
          curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/http3" \
            | python3 -c 'import json,sys; d=json.load(sys.stdin); print(d.get("result",{}).get("value"))'

          RESPONSE="$(curl -fsS -X PATCH \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"value":"off"}' \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/http3")"

          python3 - "$RESPONSE" <<'PY'
          import json, sys
          data = json.loads(sys.argv[1])
          if not data.get("success"):
              print("Cloudflare API returned failure")
              print(json.dumps(data.get("errors", [])))
              raise SystemExit(4)
          result = data.get("result", {})
          print("PATCH HTTP/3 setting:", result.get("value"))
          if result.get("value") != "off":
              raise SystemExit(5)
          PY

          echo "Verified API setting:"
          VERIFY="$(curl -fsS \
            -H "Authorization: Bearer $TOKEN" \
            -H "Content-Type: application/json" \
            "https://api.cloudflare.com/client/v4/zones/$ZONE_ID/settings/http3")"
          python3 - "$VERIFY" <<'PY'
          import json, sys
          data=json.loads(sys.argv[1])
          value=data.get("result",{}).get("value")
          print("HTTP/3 setting after PATCH:", value)
          if value != "off":
              raise SystemExit(6)
          PY

      - name: Probe production asset delivery after change
        run: |
          set -euo pipefail
          for i in 1 2 3 4 5; do
            echo "Probe $i"
            curl --http2 -fsS -o /tmp/food.webp -D /tmp/headers \
              --connect-timeout 8 --max-time 20 \
              -w 'http=%{http_code} proto=%{http_version} type=%{content_type} bytes=%{size_download} connect=%{time_connect}s ttfb=%{time_starttransfer}s total=%{time_total}s\n' \
              "https://bezdna-bar.ru/food/burger-krutoyar-v2.webp?http3fix=$GITHUB_SHA"
            grep -Ei '^(HTTP/|content-type:|content-length:|alt-svc:|server:|cf-cache-status:)' /tmp/headers || true
            test "$(wc -c < /tmp/food.webp)" -gt 100000
            if ! grep -Eqi '^alt-svc:.*h3' /tmp/headers; then
              echo "HTTP/3 advertisement is gone."
              exit 0
            fi
            echo "Edge still advertises h3; waiting for propagation..."
            sleep 15
          done

          echo "::warning::Cloudflare API reports HTTP/3 off, but this edge still advertises h3 after retries."
