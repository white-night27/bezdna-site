name: Site quality

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-smoke-lighthouse:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.17.1 --activate

      - name: Install app dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Existing static HTML tests
        run: pnpm test

      - name: Build static export
        run: pnpm build

      - name: Install diagnostic tools outside the project
        run: |
          mkdir -p /tmp/bezdna-tools
          cd /tmp/bezdna-tools
          npm init -y >/dev/null 2>&1
          npm install --no-audit --no-fund playwright@1.55.0 @lhci/cli@0.15.1
          ./node_modules/.bin/playwright install --with-deps chromium

      - name: Start static server
        run: |
          python3 -m http.server 4173 --directory out > /tmp/bezdna-server.log 2>&1 &
          echo $! > /tmp/bezdna-server.pid
          for i in {1..30}; do
            if curl -fsS http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bezdna-server.log
          exit 1

      - name: Playwright browser smoke tests
        env:
          BASE_URL: http://127.0.0.1:4173
          PLAYWRIGHT_MODULE: /tmp/bezdna-tools/node_modules/playwright
        run: node tests/browser-smoke.cjs

      - name: Lighthouse CI
        env:
          CHROME_PATH: /home/runner/.cache/ms-playwright/chromium-1187/chrome-linux/chrome
        run: /tmp/bezdna-tools/node_modules/.bin/lhci autorun --config=./lighthouserc.cjs

      - name: Show static asset sizes
        run: |
          echo "Largest files in out/:"
          find out -type f -printf '%s %p\n' | sort -nr | head -30 | awk '{ printf "%.1f KB  %s\n", $1/1024, $2 }'

      - name: Upload diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: site-quality-artifacts
          path: |
            artifacts/
            /tmp/bezdna-server.log
          if-no-files-found: ignore
          retention-days: 7
